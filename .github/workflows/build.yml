name: Build & Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release 2>&1 | tee build.log
      - name: Test
        run: swift test 2>&1 | tee test.log
      - name: Bundle .app
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dox.app
          path: build/Dox.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: "*.log"
